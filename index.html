<!DOCTYPE html>
<html>
<head><meta charset="UTF-8">
    
    <title>Loading...</title>
    <meta name="robots" content="noindex, nofollow">
    <script>
        (function() {
            // Logica Router JS
            // Recupera la lingua (primi 2 caratteri), fallback su 'it'
            var lang = (navigator.language || navigator.userLanguage || 'it').substring(0, 2);
            
            // Definisci i target (Relative paths per compatibilità GitHub)
            var target = (lang === 'en') ? 'en/' : 'it/';
            
            // Esegui il redirect
            window.location.replace(target);
        })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=it/"></noscript>
</head>
<body></body>
</html>
